<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <title>Portfolio Website</title>

    <style>
        /* SOCIAL ICONS FIXOS NA TELA */
        .social-icons {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .social-icons a {
            position: absolute;
            color: white;
            font-size: 22px;
            pointer-events: auto;
        }

        /* POSIÇÕES */
        .social-icons a:nth-child(1) { /* EMAIL - topo */
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .social-icons a:nth-child(2) { /* GITHUB - direita */
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
        }

        .social-icons a:nth-child(3) { /* DISCORD - baixo */
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .social-icons a:nth-child(4) { /* INSTAGRAM - esquerda */
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
        }
    </style>
</head>
